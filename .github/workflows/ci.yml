name: MVP checks

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: parking_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d parking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/parking_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/parking_test
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      USE_STUB: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies without AI weights
        run: >-
          python -m pip install 'fastapi>=0.121,<1' 'uvicorn>=0.30,<1'
          'SQLAlchemy>=2.0,<3' 'psycopg[binary]>=3.2,<4' 'PyJWT>=2.9,<3'
          'argon2-cffi>=23.1,<26' 'python-dotenv>=1,<2' 'python-multipart>=0.0.18,<1'
          'httpx>=0.27,<1' pytest numpy opencv-python-headless pillow streamlit
      - run: python -m app.database check --expect-database parking_test
      - run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
